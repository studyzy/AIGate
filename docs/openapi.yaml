        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/FilterUserID'
        - $ref: '#/components/parameters/FilterGroupID'
        - $ref: '#/components/parameters/FilterAPIKeyID'
        - $ref: '#/components/parameters/FilterAIModelID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 明细分页（按时间倒序）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageLogs'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/user/usage/by-model:
    get:
      tags: [user]
      summary: 本人按模型聚合的用量
      description: 与 `usage/summary` 同源，固定按 `model` 聚合（忽略 `group_by`）。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/FilterUserID'
        - $ref: '#/components/parameters/FilterGroupID'
        - $ref: '#/components/parameters/FilterAPIKeyID'
        - $ref: '#/components/parameters/FilterAIModelID'
      responses:
        '200':
          description: 按模型聚合结果（`group_by` 固定为 `model`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/user/keys:
    get:
      tags: [user]
      summary: 列出目标用户名下的自助密钥
      description: |
        `user` 角色强制作用于本人；`admin` 角色可用 `?user_id=` 指定用户，缺省为自己。
        响应不含明文 token。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FilterUserID'
      responses:
        '200':
          description: 密钥列表（无密钥时为空数组）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [user]
      summary: 创建自助密钥
      description: |
        校验顺序：数量上限（`settings.user_key_limit`，默认 5；`0` = 不限，超限 400
        `key limit reached (limit N)`）→ 模型范围（只能绑定该用户名下任意已有密钥出现过的模型，
        否则 400）→ 落库。返回 201 与一次性明文 `sk-` token。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FilterUserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserKeyCreateRequest'
      responses:
        '201':
          description: 已创建的密钥（`token` 为一次性明文）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Key'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/user/keys/{id}:
    parameters:
      - $ref: '#/components/parameters/PathID'
    get:
      tags: [user]
      summary: 读取单个自助密钥
      description: 密钥不存在或不属于目标用户时统一返回 404，避免通过 id 探测。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FilterUserID'
      responses:
        '200':
          description: 密钥（不含明文 token）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Key'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [user]
      summary: 局部更新自助密钥
      description: 仅出现的字段被修改；`bindings` 出现时整体替换并重新做模型范围校验。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FilterUserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserKeyUpdateRequest'
      responses:
        '200':
          description: 更新后的密钥（不含明文 token）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Key'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [user]
      summary: 删除自助密钥
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FilterUserID'
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/user/keys/{id}/usage:
    parameters:
      - $ref: '#/components/parameters/PathID'
    get:
      tags: [user]
      summary: 单密钥用量趋势（按日）
      description: |
        单个密钥的按日用量聚合；`user` 角色只能查询自己名下的密钥（其余 404），
        `admin` 可用 `?user_id=` 查询任意密钥；未提供 start/end 时默认最近 30 天。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/FilterUserID'
      responses:
        '200':
          description: 按日趋势
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/user/keys/{id}/rotate:
    parameters:
      - $ref: '#/components/parameters/PathID'
    post:
      tags: [user]
      summary: 换发自助密钥
      description: 换发新的 `sk-` 明文并立即使旧凭据失效；绑定与设置保留。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FilterUserID'
      responses:
        '200':
          description: 密钥（`token` 为一次性明文）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Key'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <token>`。数据面用数据面密钥 `sk-…`；
        管理面/用户面用访问 token `gk-…`（管理面要求 `role=admin`）。
    apiKeyHeader:
      type: apiKey
      in: header
      name: x-api-key
      description: |
        仅 `POST /v1/messages` 支持：以 `sk-…` 数据面密钥替代 `Authorization` 头；
        二者并存时 `x-api-key` 优先。

  parameters:
    ResponseID:
      name: id
      in: path
      required: true
      description: |
        网关生成的响应 ID：`resp_` + 32 位十六进制（如 `resp_0f3a…`）。空值按「不存在」处理（404）。
      schema:
        type: string
        pattern: '^resp_[0-9a-f]{32}$'
    PathID:
      name: id
      in: path
      required: true
      description: 资源 ID（正整数；非数字或 0 返回 400）
      schema:
        type: integer
        format: uint
        minimum: 1
    GroupBy:
      name: group_by
      in: query
      required: false
      description: 聚合维度，缺省 `date`
      schema:
        type: string
        enum: [date, model, key, user, group]
        default: date
    StartDate:
      name: start
      in: query
      required: false
      description: 起始日期（含），`YYYY-MM-DD`，按业务时区解释
      schema:
        type: string
        pattern: '^\d{4}-\d{2}-\d{2}$'
    EndDate:
      name: end
      in: query
      required: false
      description: 结束日期（含当日），`YYYY-MM-DD`，按业务时区解释
      schema:
        type: string
        pattern: '^\d{4}-\d{2}-\d{2}$'
    FilterUserID:
      name: user_id
      in: query
      required: false
      schema:
        type: integer
        format: uint
    FilterGroupID:
      name: group_id
      in: query
      required: false
      schema:
        type: integer
        format: uint
    FilterAPIKeyID:
      name: api_key_id
      in: query
      required: false
      schema:
        type: integer
        format: uint
    FilterAIModelID:
      name: ai_model_id
      in: query
      required: false
      schema:
        type: integer
        format: uint
    Page:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始，缺省 1
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: 每页条数，缺省 50，上限 500
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50

  responses:
    BadRequest:
      description: 请求体或参数非法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: |
        凭据缺失、格式错误、未知或用户/密钥被禁用。
        管理面与用户面文案为 `missing or invalid bearer token` / `user is disabled`；
        数据面为 `missing API key` / `invalid API key`。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 凭据有效但角色不足（管理面要求 `role=admin`）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 目标资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 资源存在引用冲突（如删除仍被模型引用的凭据）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: 服务内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    QuotaExceeded:
      description: |
        配额超限（状态码可配置为 429 或 403，默认 429），响应带 `Retry-After` 头。

        错误体在统一三键之外补充两个可选字段：`unit` 告诉你 `used` / `limit` 是 token
        还是金额（`token` / `cost`；旧规则默认 `token`），`currency` 只在金额口径下给出，
        为平台结算币种。
      headers:
        Retry-After:
          description: 建议重试等待秒数
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QuotaExceededErrorResponse'
    BodyTooLarge:
      description: 请求体超过 1 MiB（直接拒绝、不截断）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AnthropicBadRequest:
      description: 请求非法（`invalid_request_error`）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnthropicErrorResponse'
    AnthropicUnauthorized:
      description: 凭据缺失或无效（`authentication_error`）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnthropicErrorResponse'
    AnthropicQuotaExceeded:
      description: 配额超限（`rate_limit_error`，默认 429），响应带 `Retry-After` 头
      headers:
        Retry-After:
          description: 建议重试等待秒数
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnthropicErrorResponse'
    AnthropicBodyTooLarge:
      description: 请求体超过 1 MiB（`invalid_request_error`，直接拒绝、不截断）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnthropicErrorResponse'
    AnthropicInternalError:
      description: 服务内部错误（`api_error`）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnthropicErrorResponse'
    AnthropicUpstreamError:
      description: 无法连接上游或流式不可用（`api_error`，502）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnthropicErrorResponse'
    BadGateway:
      description: |
        数据面：无法连接上游。`message` 为 `failed to connect to LLM backend`（细节只记服务端日志，
        不回显），或 Responses 入口的 `invalid upstream response`（上游响应无法解析）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ResponseNotFound:
      description: |
        Responses 行不存在、不属于本用户，或已被保留期清理。三者同码同文
        （`previous response not found`），用于防止枚举他人的响应 ID。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # ------------------------------------------------------------------
    # 通用
    # ------------------------------------------------------------------
    Health:
      type: object
      properties:
        status:
          type: string
          example: ok
      required: [status]

    BuildInfo:
      type: object
      description: |
        构建与启动信息。`commit` / `build_time` 优先取链接器注入值，其次取 Go 工具链写入的
        VCS 元数据；两者都不可得时为 `unknown`。`dirty=true` 表示构建时工作区有未提交改动，
        该字段只对直接在工作区构建出的二进制有意义（Docker / CI 构建恒为 `false`）。
        `version` 取自 `git describe`（例如 `v0.1.0-59-g6d75021-dirty`），不是严格 SemVer。
      properties:
        version:
          type: string
          description: 构建期注入的版本串（`git describe` 形式），不是严格 SemVer
          example: v0.1.0
        commit:
          type: string
          description: 完整 git commit，或 unknown
          example: b5744933e2f316b6d50f780ed7f7c7fb1cb87dcc
        build_time:
          type: string
          description: 构建（commit）时间，RFC3339 UTC，或 unknown
          example: "2026-11-23T03:49:23Z"
        dirty:
          type: boolean
          example: false
        go_version:
          type: string
          example: go1.24.12
        started_at:
          type: string
          description: 进程启动时间，RFC3339 UTC，或 unknown
          example: "2026-11-23T05:56:29Z"
      required: [version, commit, build_time, dirty, go_version, started_at]

    Ok:
      type: object
      properties:
        ok:
          type: boolean
          example: true
      required: [ok]

    ErrorResponse:
      type: object
      description: 统一错误体（`code` 等于 HTTP 状态码）。
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            type:
              type: string
              example: error
            code:
              type: integer
              description: 等于 HTTP 状态码
          required: [message, type, code]
      required: [error]

    AnthropicErrorResponse:
      type: object
      description: Anthropic 风格错误体（`POST /v1/messages`）。
      properties:
        type:
          type: string
          enum: [error]
        error:
          type: object
          properties:
            type:
              type: string
              enum: [authentication_error, invalid_request_error, rate_limit_error, api_error]
            message:
              type: string
          required: [type, message]
      required: [type, error]

    # ------------------------------------------------------------------
    # 数据面
    # ------------------------------------------------------------------
    ChatCompletionRequest:
      type: object
      description: |
        OpenAI Chat Completions 请求。网关只读取并改写下列字段，其余字段原样转发（因此不做封闭约束）。
      properties:
        model:
          type: string
          description: 目标模型；须匹配密钥绑定的启用模型，缺省用 `primary` 绑定。支持 `provider/model_id` 前缀（如 `qcloudlkeap/deepseek-v3.2`），前缀也可为保存绑定时生成的拼接形态 `{provider}-{model_id}`（如 `hatchery-glm-4-plus/glm-4-plus`）
        messages:
          type: array
          items:
            type: object
            additionalProperties: true
        stream:
          type: boolean
          default: false
        max_tokens:
          type: integer
          description: 密钥 `max_tokens > 0` 时会被截断到该上限
        max_completion_tokens:
          type: integer
          description: 同上
      required: [messages]
      additionalProperties: true

    ChatCompletionResponse:
      type: object
      description: 上游响应体原样透传（此处仅示意常见 OpenAI 结构）。
      properties:
        id:
          type: string
        object:
          type: string
          example: chat.completion
        created:
          type: integer
          format: int64
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            additionalProperties: true
        usage:
          type: object
          additionalProperties: true
      additionalProperties: true

    OpenAIModelList:
      type: object
      properties:
        object:
          type: string
          enum: [list]
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: 上游 `model_id`（小写）
              object:
                type: string
                enum: [model]
              created:
                type: integer
                format: int64
                description: 请求时刻的 Unix 秒（非存储时间戳）
              owned_by:
                type: string
                description: 模型的 `provider`
            required: [id, object, created, owned_by]
      required: [object, data]

    AnthropicMessagesRequest:
      type: object
      description: |
        Anthropic Messages 请求。`model` 与 `max_tokens` 必填；`content` 支持字符串或内容块数组；
        未知字段被忽略（因此不做封闭约束）。
      properties:
        model:
          type: string
        max_tokens:
          type: integer
          minimum: 1
        messages:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum: [user, assistant]
              content:
                description: 字符串或内容块数组（`text` / `image` / `tool_use` / `tool_result`）
                oneOf:
                  - type: string
                  - type: array
                    items:
                      type: object
                      additionalProperties: true
            required: [role, content]
        system:
          description: 系统提示（字符串或内容块数组）
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                additionalProperties: true
        stream:
          type: boolean
          default: false
        tools:
          type: array
          items:
            type: object
            additionalProperties: true
        tool_choice:
          type: object
          additionalProperties: true
        stop_sequences:
          type: array
          items:
            type: string
        temperature:
          type: number
        top_p:
          type: number
        metadata:
          type: object
          additionalProperties: true
      required: [model, max_tokens, messages]
      additionalProperties: true

    AnthropicUsage:
      type: object
      properties:
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        cache_read_input_tokens:
          type: integer
          description: 仅当上游提供缓存命中 token 数时输出
      required: [input_tokens, output_tokens]

    AnthropicMessagesResponse:
      type: object
      properties:
        id:
          type: string
          description: 以 `msg_` 开头
        type:
          type: string
          enum: [message]
        role:
          type: string
          enum: [assistant]
        model:
          type: string
          description: 客户端请求的模型名
        content:
          type: array
          items:
            type: object
            description: 文本块 `{"type":"text","text":…}` 或工具调用块 `{"type":"tool_use","id","name","input"}`
            additionalProperties: true
        stop_reason:
          type: string
          enum: [end_turn, max_tokens, tool_use]
        stop_sequence:
          type: string
          nullable: true
        usage:
          $ref: '#/components/schemas/AnthropicUsage'
      required: [id, type, role, model, content, stop_reason, usage]

    # ------------------------------------------------------------------
    # 管理面：模型
    # ------------------------------------------------------------------
    DecisionsRequest:
      type: object
      required: [model, input, questions]
      properties:
        model:
          type: string
          description: 该密钥绑定的模型名。
        input:
          description: 上下文；字符串，或 `{role, content}` 消息数组（content 为字符串或 part 数组）。
          oneOf:
            - type: string
            - type: array
              items:
                type: object
        questions:
          type: array
          minItems: 1
          maxItems: 128
          items:
            type: object
            required: [type, instructions]
            properties:
              type:
                type: string
                enum: [predicate, choice, score, box]
              name:
                type: string
                description: 缺省时按序号赋值，并在答案里回显。
              instructions:
                type: string
              choices:
                type: array
                minItems: 2
                maxItems: 255
                description: 仅 `choice`；`value` 为字符串或布尔且必须唯一。
                items:
                  type: object
                  required: [value]
                  properties:
                    value: {}
                    description:
                      type: string
              levels:
                type: array
                minItems: 2
                maxItems: 10
                description: 仅 `score`，最低档在前。
                items:
                  type: object
                  required: [label]
                  properties:
                    label:
                      type: string
                    description:
                      type: string
        safety_identifier:
          type: string
          description: 仅 `openai-decisions` 上游支持；跨协议时返回 400。

    DecisionsResponse:
      type: object
      properties:
        model:
          type: string
        answers:
          type: array
          description: 顺序与请求 `questions` 一致；拒答项为 `{"type":"refusal","name":...}`。
          items:
            type: object
            properties:
              type:
                type: string
              name:
                type: string
              probability:
                type: number
              choice: {}
              probabilities:
                type: array
                items:
                  type: object
              score:
                type: number
              confidence:
                type: number
              box:
                type: object
        usage:
          type: object

    SystemOneRequest:
      type: object
      required: [model, state, questions]
      properties:
        model:
          type: string
        state:
          description: 上下文；字符串、对象或数组。
          oneOf:
            - type: string
            - type: object
            - type: array
        questions:
          type: object
          minProperties: 1
          maxProperties: 128
          description: key 的顺序即答案顺序。
          additionalProperties:
            type: object
            required: [type, instructions]
            properties:
              type:
                type: string
                enum: [noul, choice, score, box]
              instructions:
                type: string
              criteria:
                description: choice 为 1..255 个 key 的对象；score 为 1..10 个字符串的数组。
                oneOf:
                  - type: object
                  - type: array
                    items:
                      type: string
        images:
          type: array
          items:
            type: string
        assets:
          type: object
          description: 仅 `systemone` 上游支持；跨协议时返回 400。

    SystemOneResponse:
      type: object
      properties:
        model:
          type: string
        answers:
          type: object
          description: key 与请求 `questions` 一致。
          additionalProperties:
            type: object
        usage:
          type: object

    Model:
      type: object
      properties:
        id:
          type: integer
          format: uint
        provider:
          type: string
        model_id:
          type: string
        model_name:
          type: string
        url:
          type: string
        model_type:
          type: string
          enum: [openai-completions, anthropic-messages, openai-responses, openai-decisions, systemone, gemini-generate-content]
          description: |
            上游协议（`ai_models.model_type` 的单一事实源）。它同时决定 `url` 的拼接方式：

            - `openai-completions`：转发到 `<url>/chat/completions`
            - `openai-responses`：转发到 `<url>/responses`（`url` 须含 `/v1`）
            - `anthropic-messages`：转发到 `<url>/v1/messages`（`url` 只到 host）
            - `openai-decisions`：转发到 `<url>/decisions`（`url` 须含 `/v1`）
            - `systemone`：转发到 `<url>/systemone`（`url` 须含 `/v1`）
            - `gemini-generate-content`：转发到 `<url>/models/{model}:generateContent`
              （`url` 须含 `/v1beta`，如 `https://generativelanguage.googleapis.com/v1beta`；
              流式走 `:streamGenerateContent?alt=sse`）

            `url` 末尾的斜杠会被去除。未知或空值按 `openai-completions` 处理（兼容历史数据）。
        custom_http_headers:
          type: object
          nullable: true
          additionalProperties:
            type: string
        quota_day:
          type: integer
          description: 模型日配额上限；`-1` 表示不限
        enabled:
          type: boolean
        user_key_required:
          type: boolean
          description: |
            用户自备 Key（BYOK）模式：模型不保存共享密钥，转发密钥取密钥绑定行；
            创建时确定，不可变更。
        credential_id:
          type: integer
          format: uint
          description: 引用的凭据 ID；`0` 表示未引用（直接使用 `api_key`）
        currency:
          type: string
          pattern: '^[A-Z]{3}$|^$'
          description: |
            模型计价币种（ISO 4217 三位大写）；空串表示未配置，该模型不参与金额记账。
            每笔请求的 `cost_vendor_micros` 以此为币种。
        enable_peak_pricing:
          type: boolean
          description: |
            是否启用峰谷定价（默认 `false`）。关闭时**恒定按空闲价三列**计价；
            开启后按价目快照里的 `peak_hours` 与计费日历判定，时段无法评估时
            fail-closed 取高峰价。
        use_upstream_cost:
          type: boolean
          description: |
            是否优先采信上游自报的 `usage.cost`（默认 `true`）。开启且上游自报
            `cost > 0` 时直接采用该值，不再按价目自算；未报或 `<= 0` 时回退自算。
        context_window:
          type: integer
          description: 上下文窗口 token 数；`0` 表示未配置。仅作能力声明与展示，不据此拒绝请求。
        max_output_tokens:
          type: integer
          description: |
            模型级输出上限；`0` 表示未配置。与密钥级 `max_tokens` 取较小者作为本次请求的
            输出上限，两者都未配置时不设上限。
        supports_image:
          type: boolean
          description: 是否支持图片输入；仅作能力声明与展示，暂不拦截含图请求。
        effort_levels:
          type: array
          items:
            type: string
            enum: [none, minimal, low, medium, high, xhigh, max]
          description: 支持的 reasoning_effort 等级（按阶梯升序）；空数组表示未配置。仅作能力声明与展示。
        current_price:
          allOf:
            - $ref: '#/components/schemas/ModelPrice'
          nullable: true
          readOnly: true
          description: 当前生效的价目快照（`effective_at` 不晚于当前时刻的最新一条）；无价目时为 `null`。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, provider, model_id, model_name, url, model_type, quota_day, enabled, user_key_required, credential_id, currency, enable_peak_pricing, use_upstream_cost, context_window, max_output_tokens, supports_image, effort_levels, created_at, updated_at]

    ModelList:
      type: object
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/Model'
      required: [models]

    ModelCreateRequest:
      type: object
      properties:
        provider:
          type: string
        model_id:
          type: string
        model_name:
          type: string
        url:
          type: string
        api_key:
          type: string
          description: 上游凭据（不会出现在任何响应中）
        model_type:
          type: string
          enum: [openai-completions, anthropic-messages, openai-responses, openai-decisions, systemone, gemini-generate-content]
        custom_http_headers:
          type: object
          nullable: true
          additionalProperties:
            type: string
        quota_day:
          type: integer
          default: -1
        enabled:
          type: boolean
          default: true
        user_key_required:
          type: boolean
          default: false
          description: 自备 Key（BYOK）模式；不可与 `api_key`/`credential_id` 同时出现，创建后不可变更
        credential_id:
          type: integer
          format: uint
          description: 引用凭据 ID（须存在）
        currency:
          type: string
          description: 模型计价币种（ISO 4217 三位，大小写不敏感，服务端归一为大写）；空串 = 未配置
        enable_peak_pricing:
          type: boolean
          default: false
        use_upstream_cost:
          type: boolean
          default: true
        context_window:
          type: integer
          minimum: 0
          default: 0
        max_output_tokens:
          type: integer
          minimum: 0
          default: 0
        supports_image:
          type: boolean
          default: false
        effort_levels:
          type: array
          items:
            type: string
            enum: [none, minimal, low, medium, high, xhigh, max]
          description: 未知取值或重复取值返回 400；大小写不敏感，按阶梯升序落库。
      required: [model_id, url, model_type]

    ModelUpdateRequest:
      type: object
      description: 局部更新；仅出现的字段被修改。`api_key` 为空串时视为不修改。
      properties:
        provider:
          type: string
        model_id:
          type: string
        model_name:
          type: string
        url:
          type: string
        api_key:
          type: string
        model_type:
          type: string
          enum: [openai-completions, anthropic-messages, openai-responses, openai-decisions, systemone, gemini-generate-content]
        custom_http_headers:
          type: object
          nullable: true
        quota_day:
          type: integer
        enabled:
          type: boolean
        user_key_required:
          type: boolean
          description: 不可变更；与当前值不同返回 400。自备 Key 模型不得携带共享密钥。
        credential_id:
          type: integer
          format: uint
        currency:
          type: string
          description: 计价币种（ISO 4217 三位）；空串清除币种配置。改动后立即失效该模型的计价缓存。
        enable_peak_pricing:
          type: boolean
        use_upstream_cost:
          type: boolean
        context_window:
          type: integer
          minimum: 0
        max_output_tokens:
          type: integer
          minimum: 0
          description: 置 `0` 清除模型级上限（密钥级上限仍然生效）。
        supports_image:
          type: boolean
        effort_levels:
          type: array
          items:
            type: string
            enum: [none, minimal, low, medium, high, xhigh, max]
          description: 整体替换；空数组清除。

    ConnectivityResult:
      type: object
      description: |
        连通性探测结果（HTTP 状态码恒为 200）。
        `ok=true` 时给出 `latency_ms` 与上游真实回复 `reply`；`ok=false` 时给出 `error_kind` 与 `message`。

        2xx 不足以保证可用：响应体解析不出非空的助手消息时，按 `upstream_client` 判定失败，
        避免把「没真正调用模型」误报成连通。
      properties:
        ok:
          type: boolean
        latency_ms:
          type: integer
          description: 一次最小对话请求的完整往返毫秒数，读完响应体后才计时（`ok=true` 时存在）
        reply:
          type: string
          description: 上游真实返回的助手文本（`ok=true` 时存在，通常为 hello）
        upstream_id:
          type: string
          description: 上游响应自报的请求 id，用于和上游日志对齐
        upstream_model:
          type: string
          description: 上游响应自报的模型名
        error_kind:
          type: string
          description: 失败原因枚举（`ok=false` 时存在）
          enum: [network_unreachable, invalid_api_key, forbidden, rate_limited, upstream_server, upstream_client]
        message:
          type: string
          description: 人类可读的失败原因（`ok=false` 时存在）
      required: [ok]

    # ------------------------------------------------------------------
    # 管理面：凭据
    # ------------------------------------------------------------------
    SecretItem:
      type: object
      description: 凭据中的单条密钥项；读取时 `value` 恒为掩码。
      properties:
        key:
          type: string
          description: 请求头名
        value:
          type: string
          description: 掩码值（长度 > 4 时保留首 2 + `*`*(n-4) + 末 2；更短时整体为 `*`）
        location:
          type: string
          enum: [header]
          default: header
          description: 密钥位置，目前仅支持 `header`
      required: [key, value, location]

    Credential:
      type: object
      properties:
        id:
          type: integer
          format: uint
        name:
          type: string
        description:
          type: string
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/SecretItem'
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, name, description, secrets, enabled, created_at, updated_at]

    CredentialList:
      type: object
      properties:
        credentials:
          type: array
          items:
            $ref: '#/components/schemas/Credential'
      required: [credentials]

    CredentialCreateRequest:
      type: object
      properties:
        name:
          type: string
          description: 必填，去空白后非空
        description:
          type: string
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/SecretItem'
        enabled:
          type: boolean
          default: true
      required: [name]

    CredentialUpdateRequest:
      type: object
      description: 局部更新；`secrets` 出现时整体替换，不传则保持不变。
      properties:
        name:
          type: string
        description:
          type: string
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/SecretItem'
        enabled:
          type: boolean

    # ------------------------------------------------------------------
    # 管理面：webhook
    # ------------------------------------------------------------------
    Webhook:
      type: object
      description: webhook 订阅；`secret` 只写不读回，响应中恒为掩码。
      properties:
        id:
          type: integer
          format: uint
        name:
          type: string
        url:
          type: string
          format: uri
          description: 仅 `http`/`https`
        secret:
          type: string
          description: 掩码值（只写不读回）
        event_types:
          type: array
          items:
            type: string
          description: 订阅的事件类型；空数组表示订阅全部
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, name, url, secret, event_types, enabled, created_at, updated_at]

    WebhookList:
      type: object
      properties:
        webhooks:
          type: array
          items:
            $ref: '#/components/schemas/Webhook'
      required: [webhooks]

    WebhookCreateRequest:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
          format: uri
          description: 必填，必须是可解析的 `http`/`https` 地址
        secret:
          type: string
          description: 用于 HMAC-SHA256 签名；不回读
        event_types:
          type: array
          items:
            type: string
          description: 空数组或省略表示订阅全部
        enabled:
          type: boolean
          default: true
      required: [url]

    WebhookUpdateRequest:
      type: object
      description: 局部更新；`secret` 为空串表示保持原值。
      properties:
        name:
          type: string
        url:
          type: string
          format: uri
        secret:
          type: string
          description: 空串 = 保持不变（字段不可读回，无法用空值清空）
        event_types:
          type: array
          items:
            type: string
        enabled:
          type: boolean

    Delivery:
      type: object
      description: 一次 webhook 投递记录。
      properties:
        id:
          type: integer
          format: uint
        webhook_id:
          type: integer
          format: uint
        event_type:
          type: string
        status:
          type: string
          enum: [pending, success, failed]
        attempts:
          type: integer
          description: 已尝试次数（至多 3）
        last_status:
          type: integer
          description: 最后一次尝试的 HTTP 状态码；网络错误为 0
        last_error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, webhook_id, event_type, status, attempts, last_status, last_error, created_at, updated_at]

    DeliveryList:
      type: object
      properties:
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/Delivery'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
      required: [deliveries, total, page, page_size]

    # ------------------------------------------------------------------
    # 管理面：密钥
    # ------------------------------------------------------------------
    Binding:
      type: object
      properties:
        ai_model_id:
          type: integer
          format: uint
        model_id:
          type: string
        model_name:
          type: string
        provider:
          type: string
        role:
          type: string
          enum: [primary, fallback]
        sort_order:
          type: integer
        has_key:
          type: boolean
          description: 是否已配置绑定级上游密钥（仅 `user_key_required` 模型需要；值本身永不返回）
      required: [ai_model_id, model_id, model_name, provider, role, sort_order, has_key]

    Key:
      type: object
      properties:
        id:
          type: integer
          format: uint
        name:
          type: string
        user_id:
          type: integer
          format: uint
        group_id:
          type: integer
          format: uint
        proxy_token_prefix:
          type: string
          description: 展示前缀，形如 `sk-abcd1234…wxyz`
        max_tokens:
          type: integer
          description: 请求侧 `max_tokens` 上限；`<= 0` 表示不限
        token_quota_rules:
          type: string
          description: 密钥级周期配额（规范化规则 JSON）；空串 = 无密钥级限制。用户面只读
        enabled:
          type: boolean
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: 可选有效期（UTC）；null = 永不过期
        expired_at:
          type: string
          format: date-time
          nullable: true
          description: 首次因过期被拒绝的观测时间；null = 未发生
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/Binding'
        token:
          type: string
          description: 一次性明文，仅在创建与 rotate 响应中出现
      required: [id, name, user_id, group_id, proxy_token_prefix, max_tokens, token_quota_rules, enabled, created_at, updated_at, bindings]

    KeyList:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/Key'
      required: [keys]

    BindingRequest:
      type: object
      properties:
        ai_model_id:
          type: integer
          format: uint
        role:
          type: string
          enum: [primary, fallback]
        sort_order:
          type: integer
          default: 0
        api_key:
          type: string
          description: 绑定级上游密钥（仅 `user_key_required` 模型生效；加密落库、不回显；随 bindings 整体替换）
      required: [ai_model_id, role]

    KeyCreateRequest:
      type: object
      properties:
        name:
          type: string
        user_id:
          type: integer
          format: uint
          description: 必须引用已存在用户
        group_id:
          type: integer
          format: uint
          default: 0
        max_tokens:
          type: integer
          default: 0
        token_quota_rules:
          type: string
          description: |
            密钥级周期配额（规则数组 JSON，会校验与规范化）；空串 = 无密钥级限制。

            规则对象的完整字段：`mode`（`day` / `month` / `year` / `custom`）、`limit`
            （`-1` = 参与窗口计算但不限用量）、`unit`（**`token` 缺省 | `cost`**，见
            `Group.token_quota_rules` 的说明）、`start` / `end` / `refresh`（仅 `custom` 有效）。
            `unit=cost` 时 `limit` 为结算币种的整单位金额，上限 `9000000000000`。
        expires_at:
          type: string
          nullable: true
          description: 可选有效期（RFC 3339）；缺省/null = 永不过期
        bindings:
          type: array
          description: 非空时必须恰好一个 `primary`
          items:
            $ref: '#/components/schemas/BindingRequest'
      required: [user_id]

    KeyUpdateRequest:
      type: object
      properties:
        name:
          type: string
        max_tokens:
          type: integer
        token_quota_rules:
          type: string
          description: 空串清除密钥级配额；否则必须是合法规则数组（校验 + 规范化）
        enabled:
          type: boolean
        expires_at:
          type: string
          nullable: true
          description: RFC3339 = 设置（并清空 expired_at）；null = 清除；非法值 400
        bindings:
          type: array
          description: 出现时整体替换（`[]` 清空）
          items:
            $ref: '#/components/schemas/BindingRequest'

    # ------------------------------------------------------------------
    # 管理面：用户 / 分组 / 设置
    # ------------------------------------------------------------------
    User:
      type: object
      properties:
        id:
          type: integer
          format: uint
        username:
          type: string
        role:
          type: string
          enum: [admin, user]
        group_id:
          type: integer
          format: uint
        api_token_prefix:
          type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        token:
          type: string
          description: 一次性明文访问 token，仅在创建与 rotate 响应中出现
      required: [id, username, role, group_id, api_token_prefix, enabled, created_at, updated_at]

    UserList:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
      required: [users]

    UserCreateRequest:
      type: object
      properties:
        username:
          type: string
        role:
          type: string
          enum: [admin, user]
          default: user
        group_id:
          type: integer
          format: uint
          default: 0
        enabled:
          type: boolean
          default: true

    UserUpdateRequest:
      type: object
      properties:
        username:
          type: string
        role:
          type: string
          enum: [admin, user]
        group_id:
          type: integer
          format: uint
        enabled:
          type: boolean

    Group:
      type: object
      properties:
        id:
          type: integer
          format: uint
        name:
          type: string
        token_quota_rules:
          type: string
          description: |
            配额规则 JSON **文本**：空串表示未配置（回退全局默认），`"[]"` 表示显式不限，
            其余为经校验与规范化后的规则数组。

            规则对象字段：`mode`（`day` / `month` / `year` / `custom`）、`limit`
            （`-1` = 参与窗口计算但不限用量）、`unit`、`start` / `end` / `refresh`
            （仅 `custom` 有效）。

            `unit` 取 `token`（缺省）或 `cost`，决定该规则按 token 还是按金额限额：

            - `""` / `"token"`：窗口内 `SUM(total_tokens)` 与 `limit` 比较——旧规则的原有语义；
            - `"cost"`：窗口内 `SUM(cost_platform_micros)` 与 `limit × 1_000_000` 比较，
              `limit` 是结算币种的**整单位金额**，上限 `9000000000000`。

            写入时 `unit=token`（含空串）会被规范化为省略该键，故存量规则文本逐字节不变。
            429 响应的 `unit` / `currency` 告诉你本次拒绝的口径。
        global_token_quota_rules:
          type: string
          description: |
            组级全局配额覆盖：空串 = 未配置（回退站点规则与 `global_quota_scope`）；
            `"[]"` = 显式不限；否则该组按自身规则、固定以组用量判定。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, name, token_quota_rules, global_token_quota_rules, created_at, updated_at]

    GroupList:
      type: object
      properties:
        user_groups:
          type: array
          items:
            $ref: '#/components/schemas/Group'
      required: [user_groups]

    GroupCreateRequest:
      type: object
      properties:
        name:
          type: string
        token_quota_rules:
          type: string
          description: 非空时必须是合法规则 JSON 数组
        global_token_quota_rules:
          type: string
          description: 可选组级全局配额覆盖；非空时必须是合法规则 JSON 数组

    GroupUpdateRequest:
      type: object
      properties:
        name:
          type: string
        token_quota_rules:
          type: string
        global_token_quota_rules:
          type: string
          description: 空串清除组级覆盖

    Settings:
      type: object
      properties:
        default_token_quota_rules:
          type: string
          description: 全局默认用户配额规则 JSON 文本（默认 `"[]"`）
        global_token_quota_rules:
          type: string
          description: 全站/按组全局配额规则 JSON 文本（默认 `"[]"`）
        global_quota_scope:
          type: string
          enum: [site, group]
          default: site
        user_key_limit:
          type: integer
          default: 5
          description: 每用户自助密钥数量上限；`0` = 不限
        platform_currency:
          type: string
          pattern: '^[A-Z]{3}$'
          default: CNY
          description: |
            平台结算币种（ISO 4217 三位大写，全局唯一，默认 `CNY`）。
            每笔请求的 `cost_platform_micros` 按记账时刻的汇率折算到该币种并定死；
            改动它只影响之后的新请求，不重算历史行。
      required: [default_token_quota_rules, global_token_quota_rules, global_quota_scope, user_key_limit, platform_currency]

    SettingsUpdateRequest:
      type: object
      properties:
        default_token_quota_rules:
          type: string
          description: 必须是合法 JSON 数组文本（拒绝空串与 `null`）
        global_token_quota_rules:
          type: string
        global_quota_scope:
          type: string
          enum: [site, group]
        user_key_limit:
          type: integer
          minimum: 0
          description: 必须 `>= 0`；`0` = 不限
        platform_currency:
          type: string
          description: |
            平台结算币种（ISO 4217 三位，大小写不敏感，服务端归一为大写）；非法值返回 400。
            非空即必须合法，不支持用空串清除（清除会静默丢掉全部折算口径）。

    # ------------------------------------------------------------------
    # 用量
    # ------------------------------------------------------------------
    UsageSummaryRow:
      type: object
      properties:
        date:
          type: string
          format: date-time
          description: 仅 `group_by=date` 时出现（业务时区当日 00:00 的 UTC 时刻）
        user_id:
          type: integer
          format: uint
        api_key_id:
          type: integer
          format: uint
        ai_model_id:
          type: integer
          format: uint
        group_id:
          type: integer
          format: uint
        prompt_tokens:
          type: integer
          format: int64
        completion_tokens:
          type: integer
          format: int64
        total_tokens:
          type: integer
          format: int64
        prompt_cache_read_tokens:
          type: integer
          format: int64
        prompt_cache_write_tokens:
          type: integer
          format: int64
        request_count:
          type: integer
          format: int64
        currency:
          type: string
          description: |
            本行金额的计价币种。仅 `group_by=model` 时唯一有意义；跨模型聚合时取
            `MAX(currency)`（见 `mixed_currency`），币种混合时不要把各行相加。
        cost_vendor_micros:
          type: integer
          format: int64
          description: |
            模型币种金额（微元）。**仅 `group_by=model` 时有意义**，其余维度币种可能混合、
            不可相加，恒为 `0`。
        cost_platform_micros:
          type: integer
          format: int64
          description: |
            平台结算币种金额（微元）。记账时刻已统一到 `platform_currency`，
            任何聚合维度都可相加。
        mixed_currency:
          type: boolean
          description: 本行跨越了多个计价币种（`MAX(currency) <> MIN(currency)`）；出现即表示金额需按模型分别看待。
      required: [prompt_tokens, completion_tokens, total_tokens, prompt_cache_read_tokens, prompt_cache_write_tokens, request_count, cost_vendor_micros, cost_platform_micros]

    UsageSummary:
      type: object
      properties:
        group_by:
          type: string
          enum: [date, model, key, user, group]
        rows:
          type: array
          items:
            $ref: '#/components/schemas/UsageSummaryRow'
        total_cost_platform_micros:
          type: integer
          format: int64
          description: 当前返回各行的 `cost_platform_micros` 之和（结算币种微元）
        platform_currency:
          type: string
          description: '`total_cost_platform_micros` 的币种，取自 `settings.platform_currency`'
      required: [group_by, rows, total_cost_platform_micros, platform_currency]

    UsageLog:
      type: object
      properties:
        id:
          type: integer
          format: uint
        api_key_id:
          type: integer
          format: uint
        user_id:
          type: integer
          format: uint
        group_id:
          type: integer
          format: uint
        ai_model_id:
          type: integer
          format: uint
        model:
          type: string
          description: 解析命中的上游模型 ID
        provider:
          type: string
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
        prompt_cache_read_tokens:
          type: integer
        prompt_cache_write_tokens:
          type: integer
        status_code:
          type: integer
        latency:
          type: integer
          description: 请求耗时（毫秒）
        currency:
          type: string
          description: |
            本行**结算金额**（`cost_platform_micros`）的币种，取当前平台结算币种；
            `cost_vendor_micros` 的币种是记账时的 `ai_models.currency`，本字段不适用于它。
        cost_vendor_micros:
          type: integer
          format: int64
          description: 记账时刻的模型币种金额（微元，币种见 `ai_models.currency`）；改价、改币种都不改写历史行。
        cost_platform_micros:
          type: integer
          format: int64
          description: 记账时刻的平台结算币种金额（微元，币种见 `currency` 与 `settings.platform_currency`）。
        created_at:
          type: string
          format: date-time
      required: [id, api_key_id, user_id, group_id, ai_model_id, model, provider, prompt_tokens, completion_tokens, total_tokens, status_code, latency, currency, cost_vendor_micros, cost_platform_micros, created_at]

    UsageLogs:
      type: object
      properties:
        logs:
          type: array
          items:
            $ref: '#/components/schemas/UsageLog'
        total:
          type: integer
          format: int64
        page:
          type: integer
        page_size:
          type: integer
      required: [logs, total, page, page_size]

    # ------------------------------------------------------------------
    # 计费与金额
    # ------------------------------------------------------------------
    ModelPrice:
      type: object
      description: |
        一份价目快照。六个单价都是**整数微元 / 每百万 token**（`1` 元/百万 = `1000000`），
        峰谷两套都是原始值，不做乘数推导。
      properties:
        id:
          type: integer
          format: uint
        ai_model_id:
          type: integer
          format: uint
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: 价目币种快照（写入时取请求值或模型当时币种）；改模型币种不改写历史。
        effective_at:
          type: string
          format: date-time
          description: 生效时刻（RFC 3339，UTC 输出）；记账时取不晚于记账时刻的最新一条
        peak_hours:
          type: string
          description: 峰谷时段 JSON **文本**（结构见 `PeakHours`）；无时段时为 `"{}"`
        peak_input_hit_micros:
          type: integer
          format: int64
          description: 高峰价 · 输入（缓存命中），微元/百万 token
        peak_input_miss_micros:
          type: integer
          format: int64
          description: 高峰价 · 输入（缓存未命中），微元/百万 token
        peak_output_micros:
          type: integer
          format: int64
          description: 高峰价 · 输出，微元/百万 token
        offpeak_input_hit_micros:
          type: integer
          format: int64
          description: 空闲价 · 输入（缓存命中），微元/百万 token
        offpeak_input_miss_micros:
          type: integer
          format: int64
          description: 空闲价 · 输入（缓存未命中），微元/百万 token
        offpeak_output_micros:
          type: integer
          format: int64
          description: 空闲价 · 输出，微元/百万 token
        created_at:
          type: string
          format: date-time
      required: [id, ai_model_id, currency, effective_at, peak_hours, peak_input_hit_micros, peak_input_miss_micros, peak_output_micros, offpeak_input_hit_micros, offpeak_input_miss_micros, offpeak_output_micros, created_at]

    ModelPriceList:
      type: object
      properties:
        prices:
          type: array
          items:
            $ref: '#/components/schemas/ModelPrice'
      required: [prices]

    ModelPriceCreateRequest:
      type: object
      description: |
        追加一份价目快照。六个单价缺省为 `0`（`0` 就是合法单价，例如免费模型）。
        同一模型同一 `effective_at` 重复追加返回 409。
      properties:
        currency:
          type: string
          description: 价目币种；缺省取模型当前 `currency`，两处都没有（或非法）时返回 400
        effective_at:
          type: string
          format: date-time
          description: RFC 3339 时间戳（必填）
        peak_hours:
          type: string
          description: 峰谷时段 JSON 文本；空串 / `null` / `{}` = 无时段，结构见 `PeakHours`
        peak_input_hit_micros:
          type: integer
          format: int64
        peak_input_miss_micros:
          type: integer
          format: int64
        peak_output_micros:
          type: integer
          format: int64
        offpeak_input_hit_micros:
          type: integer
          format: int64
        offpeak_input_miss_micros:
          type: integer
          format: int64
        offpeak_output_micros:
          type: integer
          format: int64
      required: [effective_at]

    PeakHours:
      type: object
      description: |
        `peak_hours` 文本反序列化后的结构（接口里以 JSON **字符串** 传递，这里给出形状）。
        空对象 `{}` 表示无时段配置。

        判定口径：

        - 时区为 IANA 名称；`windows` 里每个窗口命中即为高峰；
        - `days` 取 Go `time.Weekday`（0=周日 … 6=周六），指窗口**开始**的那一天；
        - `start`/`end` 为 `HH:MM`，半开区间 `[start, end)`；`24:00` 合法；`end <= start`
          表示跨午夜，此时次日 `[00:00, end)` 也算——按前一天是否在 `days` 里判定；
        - 计费日历把某日登记为节假日时，该日整日强制非高峰（即使命中窗口）；
        - **无法评估时 fail-closed 取高峰价**：时区非法、窗口时钟串非法、`days` 全越界
          都算无法评估——前提是模型开了 `enable_peak_pricing`；没开则恒取空闲价。
      properties:
        timezone:
          type: string
          description: IANA 时区名，如 `Asia/Shanghai`；配置了 `windows` 时必填
          example: Asia/Shanghai
        windows:
          type: array
          items:
            type: object
            properties:
              days:
                type: array
                description: 窗口开始日的星期编号（0..6，至少一个合法值）
                items:
                  type: integer
                  minimum: 0
                  maximum: 6
                example: [1, 2, 3, 4, 5]
              start:
                type: string
                pattern: '^([01][0-9]|2[0-4]):[0-5][0-9]$'
                example: '09:00'
              end:
                type: string
                pattern: '^([01][0-9]|2[0-4]):[0-5][0-9]$'
                example: '12:00'
            required: [days, start, end]

    BillingCalendarDay:
      type: object
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: 业务时区日期标签
        is_workday:
          type: boolean
          description: '`true` = 工作日（含调休上班），`false` = 节假日（整日强制非高峰）'
        note:
          type: string
          description: 备注（如「国庆」）
      required: [date, is_workday, note]

    BillingCalendar:
      type: object
      description: 只包含已登记的日期；未登记的日子按星期几推断（周一至周五为工作日）。
      properties:
        year:
          type: integer
          description: 本次查询的年份（缺省为业务时区当年）
        days:
          type: array
          items:
            $ref: '#/components/schemas/BillingCalendarDay'
      required: [year, days]

    BillingCalendarUpsertRequest:
      type: object
      properties:
        days:
          type: array
          minItems: 1
          description: 非空数组；`date` 不可重复，`is_workday` 必须显式给出
          items:
            type: object
            properties:
              date:
                type: string
                pattern: '^\d{4}-\d{2}-\d{2}$'
              is_workday:
                type: boolean
              note:
                type: string
            required: [date, is_workday]
      required: [days]

    BillingCalendarWriteResult:
      type: object
      properties:
        days:
          type: array
          items:
            $ref: '#/components/schemas/BillingCalendarDay'
      required: [days]

    ModelRouter:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        strategy:
          type: string
          description: 策略名（落库字面量）；当前为 decision
        config:
          type: string
          description: 策略私有配置的 JSON 字符串；形状由策略决定（见 RouterStrategy.fields）
        scope:
          type: string
          enum: [global, group, user, key]
          description: 作用域；越具体越优先（key > user > group > global）
        scope_id:
          type: integer
          description: 作用域实体 id；global 恒为 0
        priority:
          type: integer
          description: 同作用域内数字小者优先；同一 (scope, scope_id, priority) 不得重复
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ModelRouterInput:
      type: object
      required: [name, strategy, config, scope, scope_id, priority]
      properties:
        name: { type: string }
        description: { type: string }
        strategy: { type: string }
        config:
          type: string
          description: 策略配置 JSON 字符串；写入时由策略校验并规范化
        scope:
          type: string
          enum: [global, group, user, key]
        scope_id:
          type: integer
          description: 非 global 作用域必须 > 0；global 忽略并按 0 落库
        priority: { type: integer }
        enabled:
          type: boolean
          description: 缺省为 true
    RouterStrategy:
      type: object
      properties:
        name: { type: string }
        title: { type: string }
        description: { type: string }
        fields:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              type:
                type: string
                enum: [string, int, bool, enum, model]
              title: { type: string }
              description: { type: string }
              default: {}
              enum:
                type: array
                items: { type: string }
              min: { type: integer }
              max: { type: integer }
              required: { type: boolean }
    RouterPreview:
      type: object
      properties:
        router_id: { type: integer }
        strategy: { type: string }
        ai_model_id: { type: integer }
        model_id: { type: string }
        model_name: { type: string }
        cause:
          type: string
          description: 判定原因（single_candidate / short_circuit / llm_classifier / fallback_primary）
        detail:
          type: object
          additionalProperties: true
        fallback:
          type: boolean
          description: true 表示策略未能决定，预览的是「回退到 primary」这一结果
    CurrencyRate:
      type: object
      description: |
        一条汇率快照：`rate_micros` 表示 **1 单位 `from_currency` = `rate_micros/1e6`
        单位 `to_currency`**（FX 报价惯例）。
      properties:
        id:
          type: integer
          format: uint
        from_currency:
          type: string
          pattern: '^[A-Z]{3}$'
        to_currency:
          type: string
          pattern: '^[A-Z]{3}$'
        effective_at:
          type: string
          format: date-time
          description: 生效时刻（RFC 3339，UTC 输出）
        rate_micros:
          type: integer
          format: int64
          description: 汇率 × 1e6；取值 `1..1000000000`（1 单位源币至多等于 1000 单位目标币）
        created_at:
          type: string
          format: date-time
      required: [id, from_currency, to_currency, effective_at, rate_micros, created_at]

    CurrencyRateList:
      type: object
      properties:
        from_currency:
          type: string
        to_currency:
          type: string
        rates:
          type: array
          items:
            $ref: '#/components/schemas/CurrencyRate'
      required: [from_currency, to_currency, rates]

    CurrencyRateCreateRequest:
      type: object
      description: |
        追加一条汇率快照。同币种对（`from_currency == to_currency`）返回 400——
        同币种折算恒为 1，不落行；同一 `effective_at` 重复追加返回 409。
      properties:
        from_currency:
          type: string
          pattern: '^[A-Za-z]{3}$'
        to_currency:
          type: string
          pattern: '^[A-Za-z]{3}$'
        effective_at:
          type: string
          format: date-time
        rate_micros:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000
      required: [from_currency, to_currency, effective_at, rate_micros]

    QuotaExceededErrorResponse:
      type: object
      description: |
        配额超限的错误体：统一三键之外补充 `unit` 与 `currency`。
        token 规则不带 `currency`（`omitempty`），cost 规则两者都有。
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            type:
              type: string
              example: error
            code:
              type: integer
              description: 等于 HTTP 状态码
            unit:
              type: string
              enum: [token, cost]
              description: 被拒规则的计量单位；旧规则（无 `unit`）也输出字面量 `token`
            currency:
              type: string
              description: 仅 `unit=cost` 时给出，为平台结算币种
          required: [message, type, code, unit]
      required: [error]

    # ------------------------------------------------------------------
    # 用户面
    # ------------------------------------------------------------------
    UserKeyCreateRequest:
      type: object
      description: |
        自助密钥创建。`bindings` 非空时必须恰好一个 `primary`，且每个模型都必须在
        「该用户名下任意已有密钥出现过的模型」集合内。
      properties:
        name:
          type: string
        max_tokens:
          type: integer
          default: 0
          description: 请求侧上限；`<= 0` 表示不封顶
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/BindingRequest'

    UserKeyUpdateRequest:
      type: object
      description: 局部更新；`bindings` 出现时整体替换并重新做模型范围校验。
      properties:
        name:
          type: string
        max_tokens:
          type: integer
        enabled:
          type: boolean
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/BindingRequest'

    Me:
      type: object
      properties:
        id:
          type: integer
          format: uint
        username:
          type: string
        role:
          type: string
          enum: [admin, user]
        group_id:
          type: integer
          format: uint
        group_name:
          type: string
          description: 分组名；未分组或分组已删除时为空串
      required: [id, username, role, group_id, group_name]

    RuleUsage:
      type: object
      properties:
        rule_index:
          type: integer
        mode:
          type: string
          enum: [day, month, year, custom]
        limit:
          type: integer
          description: '`-1` 表示参与窗口计算但不限用量'
        unit:
          type: string
          enum: [token, cost]
          description: |
            规则的计量单位，恒为字面量：`token`（缺省，旧规则即此）或 `cost`。
            `cost` 时 `limit` 是结算币种的**整单位金额**，`used` 是**微元**。
        used:
          type: integer
          format: int64
          description: 窗口内用量；`unit=token` 时为 token 总量，`unit=cost` 时为结算币种金额（微元）
        active:
          type: boolean
          description: 规则当前是否生效
        period_start:
          type: integer
          format: int64
          nullable: true
          description: 窗口起点（Unix 秒）
        period_end:
          type: integer
          format: int64
          nullable: true
          description: 窗口终点（Unix 秒）；空表示无终止
      required: [rule_index, mode, limit, unit, used, active]

    QuotaView:
      type: object
      properties:
        user_id:
          type: integer
          format: uint
        usages:
          type: array
          items:
            $ref: '#/components/schemas/RuleUsage'
      required: [user_id, usages]

    # ------------------------------------------------------------------
    # 存量导入
    # ------------------------------------------------------------------
    ImportRequest:
      type: object
      description: 一次导入的条目集合；处理顺序固定为 `user_groups → users → models → keys`。
      properties:
        dry_run:
          type: boolean
          default: false
          description: '`true` 时只返回计划，不写库'
        user_groups:
          type: array
          items:
            $ref: '#/components/schemas/ImportGroup'
        users:
          type: array
          items:
            $ref: '#/components/schemas/ImportUser'
        models:
          type: array
          items:
            $ref: '#/components/schemas/ImportModel'
        keys:
          type: array
          items:
            $ref: '#/components/schemas/ImportKey'

    ImportGroup:
      type: object
      properties:
        name:
          type: string
          description: 幂等键
        token_quota_rules:
          type: string
          description: 非空时必须是合法规则 JSON 数组

    ImportUser:
      type: object
      properties:
        name:
          type: string
          description: 幂等键
        role:
          type: string
          enum: [admin, user]
          default: user
        group:
          type: string
          description: 分组名（按名引用）；非空时须能解析到已有或本次导入的分组

    ImportModel:
      type: object
      properties:
        provider:
          type: string
        model_id:
          type: string
        model_name:
          type: string
        url:
          type: string
        api_key:
          type: string
        model_type:
          type: string
          enum: [openai-completions, anthropic-messages, openai-responses, openai-decisions, systemone, gemini-generate-content]
        quota_day:
          type: integer
          default: -1
        enabled:
          type: boolean
          default: true
      description: 幂等键为 `(provider, model_id)`。

    ImportKey:
      type: object
      properties:
        name:
          type: string
        user:
          type: string
          description: 属主用户名（按名引用）
        group:
          type: string
          description: 分组名（按名引用，可省略）
        max_tokens:
          type: integer
          default: 0
        token:
          type: string
          description: 明文数据面密钥；导入时立即哈希，明文不落库/不回显
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/ImportBinding'
      description: 幂等键为 `token` 哈希。

    ImportBinding:
      type: object
      properties:
        model:
          type: string
          description: 按 `model_id` 引用已有或本次导入的模型
        role:
          type: string
          enum: [primary, fallback]
        api_key:
          type: string
          description: 可选绑定级（自备 Key）密钥；加密落库
      required: [model, role]

    ImportDetail:
      type: object
      properties:
        kind:
          type: string
          enum: [group, user, model, key]
        ref:
          type: string
          description: 非敏感标识（名字 / `provider/model_id` / token 展示前缀）
        action:
          type: string
          enum: [created, skipped, error]
        message:
          type: string
          description: 仅 `action=error` 时给出原因
      required: [kind, ref, action]

    ImportSummary:
      type: object
      properties:
        created:
          type: integer
        skipped:
          type: integer
        errors:
          type: integer
      required: [created, skipped, errors]

    ImportResponse:
      type: object
      properties:
        dry_run:
          type: boolean
        summary:
          $ref: '#/components/schemas/ImportSummary'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ImportDetail'
      required: [dry_run, summary, details]

    # ------------------------------------------------------------------
    # 数据面：OpenAI Responses
    # ------------------------------------------------------------------
    ResponsesCreateRequest:
      type: object
      description: |
        OpenAI Responses 请求体。网关只读取并改写下列字段，其余字段原样转发给上游
        （直通路径）。转换路径会把 Responses 形状映射到 chat completions。
      properties:
        model:
          type: string
          description: 目标模型。解析规则与 `/v1/chat/completions` 一致；缺失或空串时使用绑定的 `primary`。
        input:
          description: 输入内容。字符串，或 input item 数组（`message` / `function_call_output` 等）。
          oneOf:
            - type: string
            - type: array
              items:
                type: object
        instructions:
          type: string
          description: 系统提示。转换路径映射为 system 消息；**不写入**会话历史快照。
        stream:
          type: boolean
          default: false
        max_output_tokens:
          type: integer
          description: 受密钥 `max_tokens` 上限截断（上限 `> 0` 时）。
        tools:
          type: array
          description: 工具数组（Responses 扁平形态）。非数组 → 400 `invalid tools`。内置工具在转换路径上被丢弃。
          items:
            type: object
        tool_choice:
          description: 工具选择。
        text:
          type: object
          description: 输出格式等文本配置（转换路径由 `response_format` 映射而来）。
        store:
          type: boolean
          default: true
          description: |
            **缺省为 `true`**：不传该字段时本轮正文同样落库（默认保留 7 天）。
            显式 `false` 表示本轮结果不写入存储；非布尔值 → 400 `invalid store`。
        previous_response_id:
          type: string
          description: |
            以前一轮的历史为前缀续接。**无论 `store` 取值如何，网关都会读取该行的历史内容**并
            拼进本次 `input` 发给上游。与 `conversation` 互斥。行不存在或不属于本用户 → 404
            `previous response not found`。
        conversation:
          description: |
            以会话中最新完成的一行为前缀续接（同样会读取历史）。与 `previous_response_id` 互斥。
          oneOf:
            - type: string
            - type: object
              properties:
                id:
                  type: string
              required: [id]
        background:
          type: boolean
          default: false
          description: |
            为 `true` 时立即返回 `status: queued` 的对象，任务在后台执行（受
            `-response-background-timeout` 限制）。`store` 恒为 `true`，显式 `store: false`
            → 400 `background requires store to be true`。
      required: [input]

    ResponsesObject:
      type: object
      description: |
        Responses 响应对象。`id` 恒为网关生成的 `resp_` + 32 位十六进制（不透传上游 ID）。
        流式请求的 `text/event-stream` 响应中，各事件的 `data` 为同一对象的快照。
      properties:
        id:
          type: string
          pattern: '^resp_[0-9a-f]{32}$'
        object:
          type: string
          enum: [response]
        created:
          type: integer
          description: 创建时刻的 Unix 秒（`queued` 后台对象带此字段）。
        model:
          type: string
          description: 客户端请求的模型名（回显，非上游 ID）。
        status:
          type: string
          enum: [queued, in_progress, completed, incomplete, failed, cancelled]
        output:
          type: array
          description: 输出 item 数组（`message` / `function_call` 等）。
          items:
            type: object
        incomplete_details:
          type: object
          description: 仅 `status=incomplete` 时出现；`reason` 如 `max_output_tokens`。
          properties:
            reason:
              type: string
        error:
          type: object
          nullable: true
          description: 仅 `status=failed` 时出现的失败原因。
        store:
          type: boolean
          description: 本行是否落库。由后台方式创建的行恒为 `true`。
        usage:
          type: object
          nullable: true
          description: 用量（输入/输出 token 等）；`queued` 时为 `null`。
      required: [id, object, status, output]

    ResponsesDeleted:
      type: object
      description: 删除结果。
      properties:
        id:
          type: string
        object:
          type: string
          enum: [response.deleted]
        deleted:
          type: boolean
          enum: [true]
      required: [id, object, deleted]

    ResponsesCancelConflict:
      type: object
      description: |
        取消一个已终态的行时的 400 响应体：错误信封 + 当前响应对象（客户端不必再发一次 GET）。
      properties:
        error:
          type: object
          properties:
            message:
              type: string
              example: response already finished and cannot be cancelled
            type:
              type: string
              example: invalid_request_error
        response:
          $ref: '#/components/schemas/ResponsesObject'
      required: [error]
