openapi: 3.0.3

info:
  title: Tencent Cloud AIGate
  version: 0.1.0
  description: |
    Tencent Cloud AIGate 是自托管的 LLM API 网关，纯 API 服务（无 Web UI）。三个平面：

    - **数据面** `/v1/*`：以数据面密钥（`sk-…`）经 `Authorization: Bearer` 鉴权；
      `/v1/messages` 额外接受 `x-api-key` 头（二者并存时 `x-api-key` 优先）。
    - **管理面** `/admin/*`：以 `role=admin` 用户的访问 token（`gk-…`）经 `Authorization: Bearer` 鉴权。
    - **用户面** `/api/user/*`：任意启用用户（`user` / `admin`）的访问 token 均可访问，`user` 角色强制行级隔离到本人。
    - **健康检查** `/healthz`：无需鉴权。
    - **构建信息** `/version`：无需鉴权，返回版本号、commit、构建时间与进程启动时间。

    约定：

    - 所有错误（除 Anthropic 风格的 `/v1/messages`）统一为 `ErrorResponse`，`code` 等于 HTTP 状态码。
    - 请求体上限 1 MiB：超限**直接拒绝、不截断**——数据面 413、管理面/用户面 400，文案均为 `request body too large`；空请求体返回 400。
    - 数据面 `/v1/*` 的上游成功响应体**原样透传**（本文件中的响应 schema 仅示意），
      上游错误状态码与响应体同样原样透传。
    - 数据面 `/v1/messages` 的错误统一为 Anthropic 风格 `AnthropicErrorResponse`。
    - 配额超限返回配置的状态码（默认 429）并带 `Retry-After` 头；`/v1/messages` 用
      `rate_limit_error`，其余数据面路由用 `ErrorResponse`。

tags:
  - name: health
    description: 健康检查（无鉴权）
  - name: data-plane
    description: 数据面（`sk-` 数据面密钥）
  - name: admin
    description: 管理面（`admin` 角色访问 token）
  - name: user
    description: 用户面（本人身份与用量）

servers:
  - url: http://127.0.0.1:8080
    description: 本地默认监听地址

paths:
  /healthz:
    get:
      tags: [health]
      summary: 健康检查
      security: []
      responses:
        '200':
          description: 服务存活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /version:
    get:
      tags: [health]
      summary: 构建信息
      description: |
        无需鉴权。返回当前运行二进制的版本号、commit、构建时间与进程启动时间，
        供运维核对部署实际服务的代码版本；不含配置、依赖或内部端点信息。
      security: []
      responses:
        '200':
          description: 构建与启动信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildInfo'

  /v1/chat/completions:
    post:
      tags: [data-plane]
      summary: OpenAI 兼容的对话补全（流式 / 非流式）
      description: |
        把 OpenAI Chat Completions 请求转发给密钥绑定命中的上游模型。
        网关只读取并改写 `model`、`stream`、`max_tokens`、`max_completion_tokens`，其余字段原样转发。

        模型解析：请求显式给出 `model` 时按大小写不敏感匹配（`/`、`:` 与 `-` 等价）命中的启用绑定；
        同名模型存在多个来源时，可用 `provider/model_id` 前缀精确指定来源——前缀既可为 provider 名
        （如 `qcloudlkeap/deepseek-v3.2`），也可为保存绑定时生成的拼接形态 `{provider}-{model_id}`
        （如 `hatchery-glm-4-plus/glm-4-plus`）。显式给出 `model`（含前缀）而未命中时返回 400 且
        **不回退** primary；未给出 `model` 时使用绑定的 `primary`。

        成功的非流式响应与上游状态码、响应体**原样透传**；`stream: true` 时以
        `text/event-stream` 增量返回并以 `data: [DONE]` 收尾。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: |
            上游的 200 响应（非流式原样透传；流式为 SSE）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
            text/event-stream:
              schema:
                type: string
                description: 'SSE 分片流，以 `data: [DONE]` 结束'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          description: 非流式：无法连接上游（DNS / 连接 / TLS / 超时）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/decisions:
    post:
      tags: [data-plane]
      summary: OpenAI Decisions 决策入口
      description: |
        接受 OpenAI Decisions 请求体（`input` + `questions` 数组），返回 `answers` 数组，
        顺序与请求 `questions` 一致。

        **上游路径**：命中模型 `model_type` 为 `openai-decisions` 时同协议直通；
        为 `systemone` 时由网关翻译（有损字段 `assets` 无法到达，会返回 400）。

        不支持流式：`stream: true` 返回 400。别名 `POST /decisions` 行为完全一致。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionsRequest'
      responses:
        '200':
          description: 决策结果（`answers` 数组 + 上游 `usage`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '502':
          $ref: '#/components/responses/BadGateway'

  /v1/systemone:
    post:
      tags: [data-plane]
      summary: TypeSafe System One 决策入口
      description: |
        接受 System One 请求体（`state` + `questions` 对象），返回以问题名为 key 的
        `answers` 对象。

        **上游路径**：命中模型 `model_type` 为 `systemone` 时同协议直通；
        为 `openai-decisions` 时由网关翻译（`safety_identifier` 无法到达，会返回 400）。

        不支持流式：`stream: true` 返回 400。别名 `POST /systemone` 行为完全一致。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemOneRequest'
      responses:
        '200':
          description: 决策结果（`answers` 对象 + 上游 `usage`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemOneResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: 上游（或本网关）拒绝了本次判断（`decision_refused`）
          content:
            application/json:
              schema:
                type: object
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '502':
          $ref: '#/components/responses/BadGateway'

  /v1/models:
    get:
      tags: [data-plane]
      summary: 列出密钥可用的模型
      description: |
        以 OpenAI list 格式返回密钥绑定的**启用**模型，按小写 `model_id` 去重。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 模型列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIModelList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/messages:
    post:
      tags: [data-plane]
      summary: Anthropic Messages 入站（文本 / 工具 / 图片，流式 / 非流式）
      description: |
        Anthropic Messages 原生入站。鉴权接受 `x-api-key: sk-…` 或 `Authorization: Bearer sk-…`，
        两者并存时 `x-api-key` 优先；凭据无效或缺失返回 401 `authentication_error`。

        请求校验：`model` 必填、`max_tokens` 必填且 > 0，否则 400 `invalid_request_error`；
        未知字段忽略（前向兼容）。

        上游按命中模型的 `model_type` 走两条路径：

        - `openai-completions`：请求转换为 OpenAI 格式（`system` → system 消息、图片转 data URI、
          `tool_use`/`tool_result` → `tool_calls`/`role=tool`、`tools`/`tool_choice`/`stop_sequences` 映射），
          响应与流式 SSE 回译为 Anthropic 事件序列
          （`message_start` → `content_block_start` → `content_block_delta`* → `content_block_stop` → `message_delta` → `message_stop`）。
        - `anthropic-messages`：仅替换 `model` 与施加密钥 `max_tokens` 上限，其余字段与上游响应（含 SSE）原样直通。

        复用三级配额（全局 → 模型 → 用户），超限返回 429 + `Retry-After`（`rate_limit_error`），且不访问上游。
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnthropicMessagesRequest'
      responses:
        '200':
          description: Anthropic 消息响应（流式时为 Anthropic SSE 事件序列）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicMessagesResponse'
            text/event-stream:
              schema:
                type: string
                description: Anthropic SSE 事件序列，以 `message_stop` 结束
        '400':
          $ref: '#/components/responses/AnthropicBadRequest'
        '401':
          $ref: '#/components/responses/AnthropicUnauthorized'
        '413':
          $ref: '#/components/responses/AnthropicBodyTooLarge'
        '429':
          $ref: '#/components/responses/AnthropicQuotaExceeded'
        '500':
          $ref: '#/components/responses/AnthropicInternalError'
        '502':
          $ref: '#/components/responses/AnthropicUpstreamError'

  /v1/responses:
    post:
      tags: [data-plane]
      summary: OpenAI Responses 入站（有状态 / 无状态，流式 / 非流式）
      description: |
        OpenAI Responses API 原生入站。鉴权为 `Authorization: Bearer sk-…`；错误统一为
        `ErrorResponse`（`code` 等于 HTTP 状态码，不是 Anthropic 信封）。

        **有状态字段**

        | 字段 | 类型 | 缺省 | 说明 |
        |---|---|---|---|
        | `store` | bool | `true` | 是否把本轮的累积对话落库。非布尔值 → 400 `invalid store`。 |
        | `previous_response_id` | string | — | 以该 ID 的历史为前缀续接。行不存在或不属于本用户 → 404 `previous response not found`（两者逐字节一致）。 |
        | `conversation` | string 或 `{"id": "..."}` | — | 以会话中最新完成的一行为前缀续接；会话尚无可用行时按新会话处理。与 `previous_response_id` 互斥 → 400 `previous_response_id and conversation are mutually exclusive`。 |
        | `background` | bool | `false` | 为 `true` 时立即返回 `queued` 对象，后台执行；`store` 恒为 `true`，显式 `store: false` → 400 `background requires store to be true`。非布尔值 → 400 `invalid background`。 |

        **重要——`store` 缺省为 `true`**：不传 `store` 的请求同样会把本轮正文落库
        （默认保留 `-response-retention-days` 天，默认 7 天）。要避免落库必须显式传
        `"store": false`，或由站点以 `-allow-response-storage=false` 整体关闭。

        **重要——`store: false` 不等于「不读库」**：携带 `previous_response_id` 或
        `conversation` 时，网关仍会读取父行的历史内容并拼进本次 `input` 发给上游；
        `store: false` 只表示「本轮结果不再写入存储」，不是隐私开关。

        **站点关闭存储（`-allow-response-storage=false`）**：所有请求按 `store: false` 处理，
        但下列情形一律 400（明确拒绝而非静默改写）——显式 `store: true`
        （`response storage is disabled on this gateway`）、带 `previous_response_id`/`conversation`
        （`response storage is disabled on this gateway, previous_response_id and conversation are unavailable`）、
        `background: true`（`response storage is disabled on this gateway, background is unavailable`）。

        **上游路径**：命中模型 `model_type` 为 `openai-responses` 时直通上游 `/responses`
        （原样响应与 SSE）；为 `openai-completions` / `anthropic-messages` 时经 chat completions
        转换（有损：reasoning item、内置工具等 Responses 专有结构被丢弃）。两条路径都强制上游
        `store: false`，并在响应中把 `id` 改写为网关生成的 `resp_` + 32 位十六进制。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponsesCreateRequest'
      responses:
        '200':
          description: |
            Responses 响应对象；流式时为 Responses SSE 事件序列。`background: true` 时返回
            `status: queued` 的对象。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsesObject'
            text/event-stream:
              schema:
                type: string
                description: |
                  Responses SSE 事件序列（`event:` + `data:`）。转换路径发
                  `response.created` → `response.in_progress` / `response.output_item.added` /
                  `response.output_text.delta`* → `response.completed`（或 `response.incomplete` /
                  `response.failed`）；直通路径原样转发上游事件，仅改写终态事件里的 `id` / `model`。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'

  /v1/responses/{id}:
    parameters:
      - $ref: '#/components/parameters/ResponseID'
    get:
      tags: [data-plane]
      summary: 读取一个已存储的响应
      description: |
        返回该行的响应对象（与 `POST /v1/responses` 的回包同一形状）。行不存在、不属于本用户
        或已过期被清理时，一律 404 `previous response not found`（同文同码，不泄露存在性）。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 响应对象
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsesObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ResponseNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [data-plane]
      summary: 删除一个已完成的响应
      description: |
        仅终态（`completed` / `failed` / `incomplete` / `cancelled`）可删。在途（`queued` /
        `in_progress`）→ 400 `response is still running, cancel it before deleting`，需先取消。
        删除会话中最新一行会使该 `conversation` 回退到上一行，或（无更早行时）按新会话处理。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 删除结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsesDeleted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ResponseNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/responses/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ResponseID'
    post:
      tags: [data-plane]
      summary: 取消一个在途的后台响应
      description: |
        `queued` / `in_progress` 的行被置为 `cancelled` 并中断其在途上游请求，返回取消后的
        响应对象（`status: cancelled`）。

        已终态的行返回 400，响应体是错误信封**加上当前响应对象**，便于客户端不必再发一次 GET：

        ```json
        {
          "error": {"message": "response already finished and cannot be cancelled", "type": "invalid_request_error"},
          "response": {"id": "resp_…", "object": "response", "status": "completed", "output": []}
        }
        ```

        取消与完成竞争时以先到者为准：若终态已写入，取消只会返回该终态。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 取消后的响应对象
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsesObject'
        '400':
          description: 行已终态，不可取消（响应体含当前响应对象）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsesCancelConflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ResponseNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/models:
    get:
      tags: [admin]
      summary: 列出全部模型
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 模型列表（无模型时为空数组）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [admin]
      summary: 创建模型
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelCreateRequest'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/models/{id}:
    parameters:
      - $ref: '#/components/parameters/PathID'
    get:
      tags: [admin]
      summary: 查询模型
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 模型
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [admin]
      summary: 局部更新模型
      description: 仅更新请求中出现的字段。`api_key` 仅在非空时生效（空串为 no-op，凭据无法清空）。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelUpdateRequest'
      responses:
        '200':
          description: 更新后的模型
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [admin]
      summary: 删除模型
      description: 同时清理引用该模型的全部密钥绑定。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/models/{id}/connectivity:
    parameters:
      - $ref: '#/components/parameters/PathID'
    post:
      tags: [admin]
      summary: 模型连通性测试
      description: |
        以最小请求（单条 user 消息，要求模型只回一个 `hello`，`max_tokens=8`）探测上游，验证地址可达、凭据有效且模型可调用。

        **探测结果一律以 HTTP 200 返回**，成功/失败体现在 body 的 `ok`：

        - 成功：`{"ok":true,"latency_ms":N}`（毫秒，取整且为正）；
        - 失败：`{"ok":false,"error_kind":"…","message":"…"}`，`error_kind` 为封闭枚举
          `network_unreachable` / `invalid_api_key` / `forbidden` / `rate_limited` /
          `upstream_server` / `upstream_client`。

        出站复用数据面一致的 SSRF 防护；默认严格模式下私网/回环地址会被拦截并归类为
        `network_unreachable`，需要放行时启动加 `-allow-private-upstreams`。

        仅路径 id 非法（400）与模型不存在（404）走统一错误体。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 探测结果（成功或失败）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectivityResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/models/discover:
    post:
      tags: [admin]
      summary: 拉取上游模型列表
      description: |
        用密钥向上游 `/models` 查询可用模型 ID，供控制台做选择器。

        **结果一律以 HTTP 200 返回**，成功/失败体现在 body 的 `ok`：

        - 成功：`{"ok":true,"models":["gpt-4o",…]}`；
        - 失败：`{"ok":false,"error_kind":"…","message":"…"}`，`error_kind` 与连通性探测同一枚举。

        出站复用数据面 SSRF 防护；默认严格模式下私网/回环地址被拦截并归类为
        `network_unreachable`，需要放行时启动加 `-allow-private-upstreams`。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model_type, url]
              properties:
                model_type:
                  type: string
                  enum: [openai-completions, anthropic-messages]
                url:
                  type: string
                  description: 与 model.url 语义一致（openai 带 /v1，anthropic 为 host）
                api_key:
                  type: string
                  description: 直接使用该密钥（尚未落库时）
                credential_id:
                  type: integer
                  description: 改用已保存凭据的第一个 header 密钥
      responses:
        '200':
          description: 拉取结果（成功或失败）
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  models:
                    type: array
                    items:
                      type: string
                  error_kind:
                    type: string
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/models/{id}/prices:
    parameters:
      - $ref: '#/components/parameters/PathID'
    get:
      tags: [admin]
      summary: 列出模型价目快照
      description: |
        按 `effective_at` 倒序列出该模型的全部价目快照（新版本在前）。
        价目为**追加式快照**：每笔请求取 `effective_at` 不晚于记账时刻的最新一条，
        改动历史不影响已落库的金额。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 价目列表（无价目时 `prices` 为空数组）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPriceList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [admin]
      summary: 追加一份模型价目快照
      description: |
        单价一律为**整数微元**，语义是「每百万 token 的微元数」：
        `1` 元/百万 token 记作 `1000000`，`0.02` 元/百万记作 `20000`。
        笔算口径为 `Σ(该档 token 数 × 该档单价_micros) / 1000000`，全程整数。

        `peak_hours` 为 JSON **文本**（不是对象），由服务端校验后规范化落库：

        - 空串、`null`、`{}` 表示无时段配置，落 `{}`；
        - 否则必须形如
          `{"timezone":"Asia/Shanghai","windows":[{"days":[1,2,3,4,5],"start":"09:00","end":"12:00"}]}`；
          `timezone` 为 IANA 名称，`windows` 非空；`days` 取 Go `time.Weekday`
          编号（0=周日 … 6=周六），指窗口**开始**的那一天，每个窗口至少有一个 0..6 的值；
          `start`/`end` 为 `HH:MM`（`24:00` 合法），半开区间 `[start, end)`，
          `end <= start` 表示跨午夜。

        写入前即拒掉无法评估的时段：那样的配置在记账时会 fail-closed 取高峰价，
        等于系统性多收钱。写入成功后立即失效数据面的计价缓存，无需重启。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelPriceCreateRequest'
      responses:
        '201':
          description: 已追加
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPrice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 该模型在同一 `effective_at` 已有价目（唯一键 `ai_model_id + effective_at`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/model-prices/{id}:
    delete:
      tags: [admin]
      summary: 删除一份价目快照
      description: |
        `{id}` 是**价目行** id（不是模型 id）。删除后立即失效该模型的计价缓存；
        已按此价目记账的历史金额不受影响。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 价目行 ID（正整数；非数字或 0 返回 400）
          schema:
            type: integer
            format: uint
            minimum: 1
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/model-routers:
    get:
      tags: [admin]
      summary: 列出模型路由规则（按匹配顺序）
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 规则列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  routers:
                    type: array
                    items: { $ref: '#/components/schemas/ModelRouter' }
    post:
      tags: [admin]
      summary: 新建模型路由规则
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelRouterInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelRouter' }
        '400':
          description: 校验失败（缺字段、非法作用域、未知策略、配置非法、优先级冲突）
  /admin/model-routers/strategies:
    get:
      tags: [admin]
      summary: 可用策略及其配置字段
      description: |
        下发每种策略的配置字段，供客户端渲染表单（不必硬编码策略）。
        数据面未装配策略能力时返回 503。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 策略列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  strategies:
                    type: array
                    items: { $ref: '#/components/schemas/RouterStrategy' }
        '503':
          description: 策略能力未装配
  /admin/model-routers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [admin]
      summary: 读取单条模型路由规则
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 规则
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelRouter' }
        '404':
          description: 不存在
    put:
      tags: [admin]
      summary: 更新模型路由规则（局部更新）
      description: 未提供的字段保持不变；仅改 enabled 不会扰动作用域与优先级。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelRouterInput' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelRouter' }
        '400':
          description: 校验失败
        '404':
          description: 不存在
    delete:
      tags: [admin]
      summary: 删除模型路由规则
      description: 由它路由的请求将回退到各自密钥的主模型。
      security:
        - bearerAuth: []
      responses:
        '204':
          description: 已删除
        '404':
          description: 不存在
  /admin/model-routers/{id}/preview:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      tags: [admin]
      summary: 预览一条规则的路由结果
      description: 用一个真实密钥跑一次该规则的策略判断，不向上游发送请求。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key_id]
              properties:
                api_key_id: { type: integer, minimum: 1 }
                request:
                  type: object
                  description: 一段请求体（通常含 messages），用于判断请求形态
      responses:
        '200':
          description: 预览结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouterPreview' }
        '400':
          description: 参数非法或规则/密钥不存在
        '503':
          description: 预览能力未装配
  /admin/billing-calendar:
    get:
      tags: [admin]
      summary: 读取计费日历
      description: |
        计费日历修正峰谷时段的星期匹配：登记为节假日的日期强制判为非高峰（即使
        落在 `peak_hours` 的窗口内），登记为工作日则照常按窗口判定。
        **未登记的日期按星期几推断：周一至周五视为工作日。**

        实测口径：`days` 是 `date` 列的 `YYYY-MM-DD` 标签，业务时区日期，
        与每日用量聚合同口径。
      security:
        - bearerAuth: []
      parameters:
        - name: year
          in: query
          required: false
          description: 4 位年份；缺省取业务时区的当年
          schema:
            type: integer
            minimum: 1
            maximum: 9999
        - name: month
          in: query
          required: false
          description: 月份 1..12；给出时只返回该月，缺省返回全年
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        '200':
          description: 该年（或该月）已登记的日期（未登记的日期不出现）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingCalendar'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [admin]
      summary: 批量登记计费日历（按日期覆盖写）
      description: |
        按日期 upsert：已登记的日期被覆盖，未登记的保持不变。写入成功后立即失效
        数据面的日历缓存。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingCalendarUpsertRequest'
      responses:
        '200':
          description: 已登记的日期（与请求顺序一致）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingCalendarWriteResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/billing-calendar/{date}:
    delete:
      tags: [admin]
      summary: 删除一天的日历登记
      description: 删除后该日期回到「按星期几推断」的默认口径。
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: path
          required: true
          description: 日期标签 `YYYY-MM-DD`（非此格式返回 400）
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        '200':
          description: 已删除（该日期原本未登记也返回 200）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/currency-rates:
    get:
      tags: [admin]
      summary: 列出某币种对的汇率快照
      description: |
        汇率追加式快照：`rate_micros` 的语义是 **1 单位 `from` = `rate_micros/1e6`
        单位 `to`**（FX 报价惯例，折算直接相乘）。记账时取记账时刻生效的最新一条。
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          description: 源币（ISO 4217 三位字母，大小写不敏感，服务端归一为大写）
          schema:
            type: string
            pattern: '^[A-Za-z]{3}$'
        - name: to
          in: query
          required: true
          description: 目标币（ISO 4217 三位字母，同上）
          schema:
            type: string
            pattern: '^[A-Za-z]{3}$'
      responses:
        '200':
          description: 该币种对的全部汇率快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyRateList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [admin]
      summary: 追加一条汇率快照
      description: |
        同一币种对同一 `effective_at` 重复追加返回 409。同币种折算恒为 1，
        `from_currency` 与 `to_currency` 相同直接返回 400（不落行）。
        写入成功后立即失效数据面的汇率缓存。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrencyRateCreateRequest'
      responses:
        '201':
          description: 已追加
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyRate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 该币种对在同一 `effective_at` 已有汇率
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/currency-rates/{id}:
    delete:
      tags: [admin]
      summary: 删除一条汇率快照
      description: |
        删除后立即失效数据面的汇率缓存；已按该汇率记账的历史金额不受影响。
        （汇率行不存在不报错，删除本身幂等。）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 汇率行 ID（正整数；非数字或 0 返回 400）
          schema:
            type: integer
            format: uint
            minimum: 1
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/credentials:
