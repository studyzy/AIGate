          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/keys:
    get:
      tags: [admin]
      summary: 列出全部密钥
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 密钥列表（不含明文 token）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [admin]
      summary: 创建密钥
      description: 响应中的 `token` 为一次性明文，仅此一次返回。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyCreateRequest'
      responses:
        '201':
          description: 已创建（`token` 为一次性明文）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Key'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
